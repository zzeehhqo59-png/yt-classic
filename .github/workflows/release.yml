name: release

# Builds the signed release APK only when a version tag (v*) is pushed, or by hand.
# Signing material comes from encrypted repository secrets; it is never stored in the repo.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.YTCLASSIC_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::YTCLASSIC_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ytclassic.keystore"
          echo "YTCLASSIC_KEYSTORE_PATH=$RUNNER_TEMP/ytclassic.keystore" >> "$GITHUB_ENV"

      - name: Unit tests and release build
        env:
          YTCLASSIC_STORE_PASSWORD: ${{ secrets.YTCLASSIC_STORE_PASSWORD }}
          YTCLASSIC_KEY_ALIAS: ${{ secrets.YTCLASSIC_KEY_ALIAS }}
          YTCLASSIC_KEY_PASSWORD: ${{ secrets.YTCLASSIC_KEY_PASSWORD }}
        run: ./gradlew --no-daemon test assembleRelease

      - name: Name and verify APK
        id: apk
        run: |
          VER=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          OUT="yt-classic-$VER.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$SIGNER" verify --print-certs "$OUT" | grep -i "SHA-256"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
          retention-days: 7

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.file }}" \
            --title "YT Classic ${{ steps.apk.outputs.version }}" --notes "Signed release APK built by GitHub Actions."
